<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura do Trak Club</title>
  <desc id="description">Usuários acessam o frontend Angular, que consome a API Flask e a API Open-Meteo. A API Flask persiste dados em SQLite e disponibiliza Swagger.</desc>
  <defs>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #29211e; }
      .label { font: 700 20px Arial, sans-serif; fill: #29211e; }
      .detail { font: 16px Arial, sans-serif; fill: #655d58; }
      .small { font: 14px Arial, sans-serif; fill: #655d58; }
      .box { stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7fb3a9"/>
    </marker>
  </defs>
  <rect width="1200" height="570" fill="#faf8f4" rx="24"/>
  <text x="60" y="70" class="title">Arquitetura do Trak Club</text>

  <rect x="60" y="205" width="190" height="130" rx="18" fill="#ffffff" stroke="#d9d3cd" class="box"/>
  <text x="155" y="255" text-anchor="middle" class="label">Usuários</text>
  <text x="155" y="285" text-anchor="middle" class="detail">Cliente e admin</text>

  <rect x="350" y="170" width="250" height="200" rx="18" fill="#e4f1ed" stroke="#7fb3a9" class="box"/>
  <text x="475" y="225" text-anchor="middle" class="label">Frontend</text>
  <text x="475" y="255" text-anchor="middle" class="detail">Angular 21</text>
  <text x="475" y="285" text-anchor="middle" class="small">Tailwind CSS e Axios</text>
  <text x="475" y="315" text-anchor="middle" class="small">localhost:4200</text>

  <rect x="710" y="170" width="250" height="200" rx="18" fill="#fff3d1" stroke="#e8b54b" class="box"/>
  <text x="835" y="225" text-anchor="middle" class="label">API principal</text>
  <text x="835" y="255" text-anchor="middle" class="detail">Flask e SQLAlchemy</text>
  <text x="835" y="285" text-anchor="middle" class="small">localhost:5000</text>
  <text x="835" y="315" text-anchor="middle" class="small">Swagger: /openapi</text>

  <rect x="1010" y="105" width="150" height="130" rx="18" fill="#ffffff" stroke="#d9d3cd" class="box"/>
  <text x="1085" y="155" text-anchor="middle" class="label">SQLite</text>
  <text x="1085" y="185" text-anchor="middle" class="detail">Clubes e sessões</text>

  <rect x="1010" y="340" width="150" height="130" rx="18" fill="#eaf3fb" stroke="#83add3" class="box"/>
  <text x="1085" y="390" text-anchor="middle" class="label">Open-Meteo</text>
  <text x="1085" y="420" text-anchor="middle" class="detail">Previsão do tempo</text>

  <path d="M250 270 H330" fill="none" stroke="#7fb3a9" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M600 270 H690" fill="none" stroke="#7fb3a9" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M960 225 H990" fill="none" stroke="#7fb3a9" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M600 330 C750 470, 870 450, 990 410" fill="none" stroke="#7fb3a9" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="770" y="495" text-anchor="middle" class="small">consulta de previsão e geocodificação</text>
</svg>
